spring.application.name=multi-tenant-module

# Database connection to the shared DB
spring.datasource.url=jdbc:postgresql://localhost:5433/crm_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Multi-Tenancy settings
spring.jpa.properties.hibernate.multiTenancy=SCHEMA

# We turn off auto ddl because Flyway will handle it
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Disable default Flyway, we will configure it programmatically for Public schema and Tenant schemas
spring.flyway.enabled=false
