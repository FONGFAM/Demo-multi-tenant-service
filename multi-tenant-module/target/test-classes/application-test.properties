# Test profile — datasource is injected at runtime by @DynamicPropertySource
# (TestContainers PostgreSQL container URL/user/pass override application.properties)

# Reduce noise in test output
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN
logging.level.org.flywaydb=INFO
logging.level.vn.crm=DEBUG

# Disable Spring Boot auto-configure for Flyway (project uses programmatic Flyway)
spring.flyway.enabled=false

# Faster HikariCP startup in test
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=5
